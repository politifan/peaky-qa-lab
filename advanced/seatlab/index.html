<!doctype html><html lang="ru"><meta charset="utf-8"><title>SeatLab</title>
<style>body{font:18px system-ui;background:#eef2f6;color:#152231;margin:40px auto;max-width:760px}main{background:white;border-radius:20px;padding:32px;box-shadow:0 8px 35px #ccd4df}label{display:block;margin:15px 0}input,button{font:inherit;padding:10px;border:1px solid #8090a0;border-radius:8px}button{background:#173e63;color:white;cursor:pointer}output{display:block;margin-top:24px;font-weight:bold}</style>
<main><h1>SeatLab</h1><p>Учебная мастерская бронирования Peaky Minds</p>
<form aria-label="Бронирование"><label>Владелец <input name="owner" value="alice"></label>
<label>Ключ запроса <input name="key" value="demo-request"></label>
<label>Мест <input name="quantity" type="number" value="1"></label>
<button type="submit">Забронировать</button></form><output role="status" aria-live="polite">Ожидаем запрос</output></main>
<script>const form=document.querySelector('form'),status=document.querySelector('output');
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Отправляем';
 const data=Object.fromEntries(new FormData(form));data.quantity=Number(data.quantity);data.event='demo';
 try{const response=await fetch('/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const body=await response.json();if(response.ok||__FALSE_SUCCESS__)status.textContent='Бронь '+(body.id||'создана');
 else status.textContent='Ошибка '+response.status;}catch(error){status.textContent='Ошибка сети';}});</script></html>
